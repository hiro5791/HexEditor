# ビルドとテスト (PKG-23、テスト方針 9 章)
#   プッシュ・プルリクエスト: build (3 種類 × 2 アーキテクチャ)、test-x64、test-arm64、i18n、lint、size、配布物の検査
#   毎晩: 性能テストと全規模のテスト (Category=Nightly)、ポータブル版を起動する配布のテスト
# フォークからの PR にも Secrets を使う手順はない (PKG-23 の仕様 5)。
name: ci

on:
  push:
    branches: [main, phase0]
  pull_request:
  schedule:
    - cron: "0 17 * * *" # 毎日 02:00 (JST)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  # テストデータ (スパースファイル) の置き場所。ランナーの一時ドライブ (NTFS) を使う。
  HEXEDITOR_TESTDATA: ${{ github.workspace }}\..\testdata

jobs:
  # 配布物のビルド (PKG-10、PKG-23): 3 種類 × 2 アーキテクチャ。署名はしない。成果物は 7 日間残す。
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        distro: [Msix, Installer, Portable]
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-
      - name: Publish
        shell: pwsh
        run: ./build/publish.ps1 -Distro ${{ matrix.distro }} -Arch ${{ matrix.arch }} -Commit "$("${{ github.sha }}".Substring(0, 7))"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: HexEditor-${{ matrix.distro }}-${{ matrix.arch }}
          retention-days: 7
          path: |
            artifacts/${{ matrix.distro }}/${{ matrix.arch }}/*.zip
            artifacts/${{ matrix.distro }}/${{ matrix.arch }}/*.exe
            artifacts/${{ matrix.distro }}/${{ matrix.arch }}/*.nupkg
            artifacts/${{ matrix.distro }}/${{ matrix.arch }}/*.msix
            artifacts/${{ matrix.distro }}/${{ matrix.arch }}/RELEASES*
            artifacts/${{ matrix.distro }}/${{ matrix.arch }}/releases.*.json

  test-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-
      - name: Build
        run: |
          dotnet build tests/HexEditor.Core.Tests -c Release
          dotnet build tests/HexEditor.Platform.Tests -c Release
          dotnet build tests/HexEditor.Performance.Tests -c Release
          dotnet build tools/TestDataGen -c Release
      - name: Build app (x64)
        run: dotnet build src/HexEditor.App -c Release -p:Platform=x64
      - name: Unit and integration tests
        if: github.event_name != 'schedule'
        run: |
          dotnet test tests/HexEditor.Core.Tests -c Release --no-build --filter "Category!=Nightly" --logger "trx;LogFileName=core.trx" --logger "console;verbosity=normal" --results-directory TestResults
          dotnet test tests/HexEditor.Platform.Tests -c Release --no-build --logger "trx;LogFileName=platform.trx" --logger "console;verbosity=normal" --results-directory TestResults
      - name: Nightly tests (full scale)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          dotnet test tests/HexEditor.Core.Tests -c Release --no-build --logger "trx;LogFileName=core-full.trx" --results-directory TestResults
          dotnet test tests/HexEditor.Platform.Tests -c Release --no-build --logger "trx;LogFileName=platform-full.trx" --results-directory TestResults
      - name: Performance tests
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: dotnet test tests/HexEditor.Performance.Tests -c Release --no-build --logger "trx;LogFileName=performance.trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-x64
          retention-days: 7
          path: TestResults/

  # ARM64 のランナーで同じテスト (PKG-15、TC-PKG-15-03)。テストのプロセスのアーキテクチャをログに出す。
  test-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-
      - name: Runner architecture (TC-PKG-15-03)
        shell: pwsh
        run: |
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          Write-Host "OS architecture: $arch"
          if ("$arch" -ne 'Arm64') { throw "test-arm64 is not running on ARM64 ($arch)." }
      - name: Unit and integration tests
        run: |
          dotnet test tests/HexEditor.Core.Tests -c Release --filter "Category!=Nightly" --logger "trx;LogFileName=core-arm64.trx" --logger "console;verbosity=normal" --results-directory TestResults
          dotnet test tests/HexEditor.Platform.Tests -c Release --logger "trx;LogFileName=platform-arm64.trx" --logger "console;verbosity=normal" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-arm64
          retention-days: 7
          path: TestResults/

  # リソースの検査 (09 の UI-42 の仕様 6)。用語集の検査 (UI-48) は検査ができたらここに加える。
  i18n:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-
      - name: Resource tests
        run: dotnet test tests/HexEditor.Core.Tests -c Release --filter "FullyQualifiedName~HexEditor.Core.Tests.I18n" --logger "console;verbosity=normal"

  # Markdown (docs/) と .editorconfig の検査。
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Markdown
        uses: DavidAnson/markdownlint-cli2-action@v20
      - name: EditorConfig
        run: |
          curl -sSL https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v3.3.0/ec-linux-amd64.tar.gz | tar xz
          ./bin/ec-linux-amd64

  # サイズの計測 (PKG-16)。PR と、ラベル size-increase-approved の付いた変更では警告だけにする。
  size:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: HexEditor-*
          path: artifacts
      - name: Measure
        shell: pwsh
        run: |
          $warnOnly = '${{ github.event_name }}' -eq 'pull_request' -or '${{ contains(github.event.pull_request.labels.*.name, 'size-increase-approved') }}' -eq 'true'
          ./build/measure-size.ps1 -ArtifactsDir artifacts -WarnOnly:$warnOnly

  # 配布物の検査 (TC-PKG-10-01、TC-PKG-10-02、zip の構成、MSIX の版)。
  artifacts:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v4
        with:
          pattern: HexEditor-*
          path: downloaded
      - name: Arrange artifacts
        shell: pwsh
        run: |
          foreach ($d in Get-ChildItem downloaded -Directory) {
            $null, $distro, $arch = $d.Name -split '-'
            $target = "artifacts/$distro/$arch"
            New-Item -ItemType Directory -Force $target | Out-Null
            Copy-Item "$($d.FullName)/*" $target -Recurse
          }
      - name: Artifact tests
        shell: pwsh
        run: ./build/tests/Test-Artifacts.ps1 -ArtifactsDir artifacts

  # ポータブル版を起動する配布のテスト (TC-PKG-05-02〜05、TC-PKG-06-04)。毎晩と手動の実行で行う。
  # テスト用のビルド (build-test) で、編集・保存を伴うもの (TC-PKG-06-01、TC-PKG-06-02、TC-PKG-13-03) も行う。
  portable:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [build, build-test]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: HexEditor-Portable-x64
          path: portable
      - uses: actions/download-artifact@v4
        with:
          name: HexEditorTest-Portable-x64
          path: portable-test
      - name: Test data
        run: dotnet run --project tools/TestDataGen -c Release -- TD-SEQ-1M testdata
      - name: Portable tests
        shell: pwsh
        run: |
          ./build/tests/Test-Portable.ps1 -Zip (Get-ChildItem portable -Filter '*-portable.zip' | Select-Object -First 1).FullName `
            -TestZip (Get-ChildItem portable-test -Filter '*-portable.zip' | Select-Object -First 1).FullName -TestDataDir (Resolve-Path testdata).Path

  # UI テスト・結合テスト (テスト方針 6.5): テスト用のビルド (Debug。HEX_TEST_HOOKS を含む) のアプリを起動して操作する。
  ui-tests:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build app (x64, test build)
        run: dotnet build src/HexEditor.App -c Debug -p:Platform=x64

      - name: Build UI tests
        run: dotnet build tests/HexEditor.UITests -c Release

      - name: UI tests
        env:
          HEXEDITOR_UITEST_ARTIFACTS: ${{ github.workspace }}\TestResults\ui-artifacts
        run: dotnet test tests/HexEditor.UITests -c Release --no-build --filter "Category=UI" --logger "trx;LogFileName=ui.trx" --results-directory TestResults

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: TestResults/

  # ---- 配布物を入れて起動する配布のテスト (テスト方針 6.2)。毎晩と手動の実行で行う ----

  # テスト用のビルド (publish.ps1 -TestHooks。テスト用の命令の通り道を含む): 3 種類 × 2 アーキテクチャ。配らない。
  build-test:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro: [Msix, Installer, Portable]
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-
      - name: Publish (test build)
        shell: pwsh
        run: ./build/publish.ps1 -Distro ${{ matrix.distro }} -Arch ${{ matrix.arch }} -TestHooks -Commit "$("${{ github.sha }}".Substring(0, 7))"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: HexEditorTest-${{ matrix.distro }}-${{ matrix.arch }}
          retention-days: 3
          path: |
            artifacts/${{ matrix.distro }}/${{ matrix.arch }}/*.zip
            artifacts/${{ matrix.distro }}/${{ matrix.arch }}/HexEditor-0.0.0-local-*-Setup.exe
            artifacts/${{ matrix.distro }}/${{ matrix.arch }}/*.msix

  # 3 種類の配布形態を入れて起動する (TC-PKG-12-01、TC-UI-40-01、TC-PKG-13-01、TC-PKG-30-02、TC-PKG-12-03、
  # ARM64 では TC-PKG-15-01)。x64 は windows-latest、ARM64 は windows-11-arm のランナー。
  distribution:
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v4
        with:
          pattern: HexEditorTest-*-${{ matrix.arch }}
          path: testbuilds
      - name: Test data
        run: |
          dotnet run --project tools/TestDataGen -c Release -- TD-SEQ-1M testdata
          dotnet run --project tools/TestDataGen -c Release --no-build -- TD-RANDOM-16M testdata
      # 開発中のビルド (dotnet build の出力) の配布形態の表示 (TC-PKG-12-01) は x64 で確かめる。
      - name: Build app (development, test build)
        if: matrix.arch == 'x64'
        run: dotnet build src/HexEditor.App -c Debug -p:Platform=x64
      - name: Distribution tests
        # Appx と International のモジュールを使うため Windows PowerShell で動かす。
        shell: powershell
        run: |
          $arch = '${{ matrix.arch }}'
          $dev = Get-ChildItem src/HexEditor.App/bin -Recurse -Filter HexEditor.exe -ErrorAction SilentlyContinue | Where-Object FullName -like '*\Debug\*' | Select-Object -First 1
          $params = @{
            Arch        = $arch
            PortableZip = (Get-ChildItem "testbuilds/HexEditorTest-Portable-$arch" -Filter '*-portable.zip').FullName
            Setup       = (Get-ChildItem "testbuilds/HexEditorTest-Installer-$arch" -Filter "HexEditor-0.0.0-local-$arch-Setup.exe").FullName
            Msix        = (Get-ChildItem "testbuilds/HexEditorTest-Msix-$arch" -Filter '*.msix').FullName
            TestDataDir = (Resolve-Path testdata).Path
          }
          if ($dev) { $params.DevExe = $dev.FullName }
          ./build/tests/Test-Distributions.ps1 @params
          exit $LASTEXITCODE

  # MSIX 版 (テスト用の証明書): 実行エイリアス (TC-PKG-03-02)、ドイツ語の説明 (TC-PKG-03-04)、
  # プレビュー版から安定版への更新 (TC-PKG-28-02。版 1.3.0-preview.2 と 1.3.0 でビルドする)。
  msix:
    needs: build-test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/download-artifact@v4
        with:
          name: HexEditorTest-Msix-x64
          path: msix-test
      - name: Build 1.3.0-preview.2 and 1.3.0
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force msix-versions | Out-Null
          foreach ($v in '1.3.0-preview.2', '1.3.0') {
            ./build/publish.ps1 -Distro Msix -Arch x64 -Version $v
            Copy-Item "artifacts/Msix/x64/HexEditor-$v-x64.msix" msix-versions/
          }
      - name: Test data
        run: dotnet run --project tools/TestDataGen -c Release -- TD-SEQ-1M testdata
      - name: MSIX tests
        shell: powershell
        run: |
          ./build/tests/Test-Msix.ps1 -TestMsix (Get-ChildItem msix-test -Filter '*.msix').FullName `
            -PreviewMsix (Resolve-Path msix-versions/HexEditor-1.3.0-preview.2-x64.msix).Path `
            -StableMsix (Resolve-Path msix-versions/HexEditor-1.3.0-x64.msix).Path -TestDataDir (Resolve-Path testdata).Path
          exit $LASTEXITCODE

  # 配布形態に依存しない UI テストを、3 種類の配布形態のテスト用のビルドで実行する (TC-PKG-01-02)。
  ui-distro:
    needs: build-test
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        distro: [Msix, Installer, Portable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: HexEditorTest-${{ matrix.distro }}-x64
          path: testbuild
      - name: Install
        shell: powershell
        run: |
          $file = Get-ChildItem testbuild | Where-Object { $_.Name -like '*-portable.zip' -or $_.Name -like 'HexEditor-0.0.0-local-*-Setup.exe' -or $_.Name -like '*.msix' } | Select-Object -First 1
          ./build/tests/Install-TestBuild.ps1 -Distro ${{ matrix.distro }} -Path $file.FullName
      - name: Build UI tests
        run: dotnet build tests/HexEditor.UITests -c Release
      - name: UI tests
        # 失敗したテストがあっても、結果の突き合わせ (same-results) に進む。
        continue-on-error: true
        env:
          HEXEDITOR_UITEST_ARTIFACTS: ${{ github.workspace }}\TestResults\ui-artifacts
        run: dotnet test tests/HexEditor.UITests -c Release --no-build --filter "Category=UI" --logger "trx;LogFileName=ui-${{ matrix.distro }}.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-distro-${{ matrix.distro }}
          retention-days: 7
          path: TestResults/

  same-results:
    needs: ui-distro
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ui-distro-*
          path: ui-results
      - name: Compare (TC-PKG-01-02)
        shell: pwsh
        run: ./build/tests/Test-SameResults.ps1 -Trx (Get-ChildItem ui-results -Recurse -Filter 'ui-*.trx').FullName
