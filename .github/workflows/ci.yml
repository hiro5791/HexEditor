# ビルドとテスト (PKG-23、テスト方針 9 章)
#   プッシュ・プルリクエスト: ビルド、単体・結合テスト (Nightly を除く)
#   毎晩: 性能テストと全規模のテスト (Category=Nightly)
name: ci

on:
  push:
    branches: [main, phase0]
  pull_request:
  schedule:
    - cron: "0 17 * * *" # 毎日 02:00 (JST)
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # テストデータ (スパースファイル) の置き場所。ランナーの一時ドライブ (NTFS) を使う。
  HEXEDITOR_TESTDATA: ${{ github.workspace }}\..\testdata

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Core and tests
        run: |
          dotnet build src/HexEditor.Core -c Release
          dotnet build tests/HexEditor.Core.Tests -c Release
          dotnet build tests/HexEditor.Performance.Tests -c Release
          dotnet build tools/TestDataGen -c Release

      - name: Build app (x64)
        run: dotnet build src/HexEditor.App -c Release -p:Platform=x64

      - name: Unit and integration tests
        if: github.event_name != 'schedule'
        run: dotnet test tests/HexEditor.Core.Tests -c Release --no-build --filter "Category!=Nightly" --logger "trx;LogFileName=core.trx" --results-directory TestResults

      - name: Nightly tests (full scale)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: dotnet test tests/HexEditor.Core.Tests -c Release --no-build --logger "trx;LogFileName=core-full.trx" --results-directory TestResults

      - name: Performance tests
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: dotnet test tests/HexEditor.Performance.Tests -c Release --no-build --logger "trx;LogFileName=performance.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
